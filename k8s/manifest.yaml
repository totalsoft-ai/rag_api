apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-agent
  namespace: ${NAMESPACE}
  labels:
    app: rag-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-agent
  template:
    metadata:
      labels:
        app: rag-agent
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      imagePullSecrets:
        - name: registry-creds
      containers:
      - name: rag-agent
        image: ${REGISTRY}/totalsoft-ai/rag_api:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        envFrom:
        - configMapRef:
            name: rag-agent-config
        - secretRef:
            name: rag-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: ${NAMESPACE}
  labels:
    app: rag-agent
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: rag-agent
---
# Route through the cluster's shared Gateway API gateway (gateway/shared, Envoy
# Gateway — replaced ingress-nginx in Nov 2026). No TLS section on this host, so
# the route attaches to both the HTTP and HTTPS listeners (HTTPS uses the
# gateway's default *.totalsoft.local certificate), as the old Ingress did.
#
# - The old `rewrite-target: /` on path `/` was a no-op in ingress-nginx; dropped.
# - The 512m `proxy-body-size` is intentionally not carried over: Envoy streams
#   request bodies with no size cap, and buffering 512 MiB in the gateway's
#   memory per upload is not safe. The app enforces its own limits.
# - 6000s request timeout (as translated from the old proxy timeouts).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rag-agent
  namespace: ${NAMESPACE}
spec:
  parentRefs:
    - {name: shared, namespace: gateway}
  hostnames: ["${HOST}"]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      timeouts: {request: 6000s}
      backendRefs: [{name: rag-service, port: 80}]
